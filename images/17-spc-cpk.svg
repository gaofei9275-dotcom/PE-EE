<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" font-family="PingFang SC, Microsoft YaHei, Helvetica, Arial, sans-serif">
  <rect width="900" height="480" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">SPC 统计过程控制：PE 每天盯的那张图</text>

  <!-- 控制图 -->
  <text x="40" y="64" font-size="14" font-weight="700" fill="#2563eb">X-bar 控制图：中心线 + 上下控制限</text>
  <rect x="40" y="78" width="560" height="230" rx="10" fill="#ffffff" stroke="#cbd5e1"/>

  <!-- 规格限与控制限 -->
  <rect x="70" y="100" width="500" height="180" fill="#f8fafc"/>
  <line x1="70" y1="130" x2="570" y2="130" stroke="#dc2626" stroke-width="2"/>
  <text x="576" y="134" font-size="10.5" fill="#dc2626">USL 规格上限</text>
  <line x1="70" y1="250" x2="570" y2="250" stroke="#dc2626" stroke-width="2"/>
  <text x="576" y="254" font-size="10.5" fill="#dc2626">LSL 规格下限</text>

  <line x1="70" y1="155" x2="570" y2="155" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="576" y="159" font-size="10.5" fill="#2563eb">UCL 控制上限</text>
  <line x1="70" y1="225" x2="570" y2="225" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="576" y="229" font-size="10.5" fill="#2563eb">LCL 控制下限</text>
  <line x1="70" y1="190" x2="570" y2="190" stroke="#059669" stroke-width="2"/>
  <text x="576" y="194" font-size="10.5" fill="#059669">CL 中心线（目标值）</text>

  <!-- 数据点 -->
  <g fill="#334155">
    <circle cx="100" cy="185" r="3.5"/><circle cx="130" cy="198" r="3.5"/><circle cx="160" cy="182" r="3.5"/>
    <circle cx="190" cy="196" r="3.5"/><circle cx="220" cy="188" r="3.5"/><circle cx="250" cy="200" r="3.5"/>
    <circle cx="280" cy="180" r="3.5"/><circle cx="310" cy="205" r="3.5"/><circle cx="340" cy="215" r="3.5"/>
    <circle cx="370" cy="212" r="3.5"/><circle cx="400" cy="222" r="3.5"/><circle cx="430" cy="168" r="3.5" fill="#dc2626"/>
    <circle cx="460" cy="160" r="3.5" fill="#dc2626"/><circle cx="490" cy="150" r="3.5" fill="#dc2626"/>
    <circle cx="520" cy="120" r="3.5" fill="#dc2626"/><circle cx="550" cy="196" r="3.5"/>
  </g>
  <text x="500" y="108" font-size="11" font-weight="700" fill="#dc2626">失控：连续点单边趋势 + 超 UCL</text>
  <text x="70" y="292" font-size="11" fill="#64748b">批次 / 时间 →</text>

  <!-- 规则 -->
  <text x="40" y="326" font-size="14" font-weight="700" fill="#7c3aed">Western Electric 八大判异规则（记住前四条够用）</text>
  <g font-size="11.5">
    <rect x="40" y="340" width="200" height="58" rx="8" fill="#faf5ff" stroke="#c4b5fd"/>
    <text x="56" y="362" font-weight="700" fill="#5b21b6">规则1</text>
    <text x="56" y="380" fill="#1e293b">1 点超出 3σ</text>
    <text x="56" y="394" fill="#64748b">（明显异常）</text>

    <rect x="250" y="340" width="200" height="58" rx="8" fill="#faf5ff" stroke="#c4b5fd"/>
    <text x="266" y="362" font-weight="700" fill="#5b21b6">规则2</text>
    <text x="266" y="380" fill="#1e293b">连续 9 点在同一侧</text>
    <text x="266" y="394" fill="#64748b">（均值偏移）</text>

    <rect x="460" y="340" width="200" height="58" rx="8" fill="#faf5ff" stroke="#c4b5fd"/>
    <text x="476" y="362" font-weight="700" fill="#5b21b6">规则3</text>
    <text x="476" y="380" fill="#1e293b">连续 6 点持续上升/下降</text>
    <text x="476" y="394" fill="#64748b">（漂移，像耗材老化）</text>

    <rect x="670" y="340" width="190" height="58" rx="8" fill="#faf5ff" stroke="#c4b5fd"/>
    <text x="686" y="362" font-weight="700" fill="#5b21b6">规则4</text>
    <text x="686" y="380" fill="#1e293b">连续 14 点上下交替</text>
    <text x="686" y="394" fill="#64748b">（系统性震荡）</text>
  </g>

  <!-- Cpk -->
  <text x="620" y="64" font-size="14" font-weight="700" fill="#059669">Cpk / Cp：能力指数</text>
  <rect x="620" y="78" width="240" height="230" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/>
  <g font-size="12">
    <text x="638" y="106" font-weight="700" fill="#065f46">Cp = (USL−LSL) / 6σ</text>
    <text x="638" y="132" font-size="11" fill="#334155">只看离散程度（精密度）</text>
    <text x="638" y="158" font-weight="700" fill="#065f46">Cpk = min(CPU, CPL)</text>
    <text x="638" y="176" font-size="11" fill="#334155">CPU = (USL−μ)/3σ</text>
    <text x="638" y="192" font-size="11" fill="#334155">CPL = (μ−LSL)/3σ</text>
    <text x="638" y="220" font-size="11.5" fill="#1e293b">Cpk 同时考虑 偏移 + 离散</text>
    <text x="638" y="248" font-size="11.5" fill="#dc2626">Cpk &lt; 1.33 通常要求改善</text>
    <text x="638" y="266" font-size="11.5" fill="#059669">Cpk ≥ 1.67 才算能力充足</text>
    <text x="638" y="284" font-size="11.5" fill="#64748b">Ppk 用整体标准差（长期）</text>
    <text x="638" y="300" font-size="11.5" fill="#64748b">Cpk 用组内标准差（短期）</text>
  </g>

  <!-- 分布示意 -->
  <text x="40" y="424" font-size="12.5" font-weight="700" fill="#334155">直觉理解：Cpk 就是"分布离规格限还有几个 σ"</text>
  <g>
    <rect x="330" y="398" width="330" height="72" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <line x1="345" y1="452" x2="645" y2="452" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M420 450 C450 450 460 412 495 412 C530 412 540 450 570 450" stroke="#059669" stroke-width="2.5" fill="none"/>
    <line x1="600" y1="408" x2="600" y2="452" stroke="#dc2626" stroke-width="1.8"/>
    <text x="606" y="422" font-size="10" fill="#dc2626">USL</text>
    <text x="350" y="470" font-size="10" fill="#64748b">分布窄、离限远 → Cpk 高</text>
  </g>
</svg>
