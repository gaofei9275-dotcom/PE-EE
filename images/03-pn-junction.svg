<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="PingFang SC, Microsoft YaHei, Helvetica, Arial, sans-serif">
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">半导体三块基石：能带、掺杂、PN 结</text>

  <!-- 左：能带 -->
  <text x="40" y="66" font-size="14" font-weight="700" fill="#2563eb">① 能带：为什么硅是半导体</text>
  <rect x="40" y="80" width="270" height="180" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="56" y="106" font-size="11.5" fill="#334155">导体：价带与导带重叠，电子自由</text>
  <rect x="66" y="116" width="120" height="14" fill="#475569"/>
  <rect x="66" y="132" width="120" height="14" fill="#94a3b8"/>
  <text x="200" y="131" font-size="11" fill="#334155">重叠</text>

  <text x="56" y="168" font-size="11.5" fill="#334155">半导体：有禁带 Eg（Si ≈ 1.12 eV）</text>
  <rect x="66" y="178" width="120" height="14" fill="#94a3b8"/>
  <rect x="66" y="212" width="120" height="14" fill="#475569"/>
  <path d="M126 192 L126 212" stroke="#dc2626" stroke-width="1.5"/>
  <text x="132" y="206" font-size="11" fill="#dc2626">Eg</text>

  <text x="56" y="248" font-size="11.5" fill="#334155">绝缘体：Eg 很大，电子跳不过去</text>
  <rect x="66" y="258" width="120" height="14" fill="#cbd5e1"/>
  <rect x="66" y="298" width="120" height="14" fill="#475569"/>
  <path d="M126 272 L126 298" stroke="#dc2626" stroke-width="1.5"/>
  <text x="132" y="290" font-size="11" fill="#dc2626">大</text>

  <!-- 中：掺杂 -->
  <text x="350" y="66" font-size="14" font-weight="700" fill="#059669">② 掺杂：给硅"调味"</text>
  <rect x="350" y="80" width="250" height="180" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>

  <circle cx="392" cy="130" r="9" fill="#1d4ed8"/>
  <text x="410" y="134" font-size="12" font-weight="700" fill="#1e40af">P（磷/砷）→ N 型</text>
  <text x="366" y="152" font-size="11.5" fill="#334155">Ⅴ 族，多一个价电子</text>
  <text x="366" y="170" font-size="11.5" fill="#334155">多子 = 电子，施主 Donor</text>
  <circle cx="380" cy="184" r="4" fill="#2563eb"/>
  <text x="392" y="188" font-size="10.5" fill="#2563eb">额外电子</text>

  <circle cx="392" cy="212" r="9" fill="#b91c1c"/>
  <text x="410" y="216" font-size="12" font-weight="700" fill="#991b1b">B（硼）→ P 型</text>
  <text x="366" y="234" font-size="11.5" fill="#334155">Ⅲ 族，少一个价电子</text>
  <text x="366" y="252" font-size="11.5" fill="#334155">多子 = 空穴，受主 Acceptor</text>
  <circle cx="380" cy="266" r="4" fill="#ffffff" stroke="#dc2626"/>
  <text x="392" y="270" font-size="10.5" fill="#dc2626">空穴</text>

  <!-- 右：PN结 -->
  <text x="640" y="66" font-size="14" font-weight="700" fill="#d97706">③ PN 结：一切器件之母</text>
  <rect x="640" y="80" width="220" height="180" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="656" y="110" width="85" height="86" fill="#dbeafe" stroke="#2563eb"/>
  <text x="698" y="158" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">P 型</text>
  <rect x="741" y="110" width="85" height="86" fill="#fee2e2" stroke="#dc2626"/>
  <text x="783" y="158" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">N 型</text>
  <rect x="736" y="110" width="10" height="86" fill="#fef3c7" stroke="#d97706"/>
  <text x="750" y="222" font-size="11" fill="#92400e">耗尽区 Depletion</text>
  <text x="656" y="240" font-size="11" fill="#334155">内建电场阻止载流子继续扩散</text>
  <text x="656" y="256" font-size="11" fill="#334155">正偏 → 导通；反偏 → 截止</text>

  <!-- 底部 MOSFET 相关的结 -->
  <text x="40" y="292" font-size="14" font-weight="700" fill="#7c3aed">④ 三张你一定会听到的 I-V / C-V 曲线</text>

  <rect x="40" y="305" width="273" height="180" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="56" y="328" font-size="12" font-weight="700" fill="#334155">PN 结 I-V（整流特性）</text>
  <path d="M70 460 L70 355 L200 355" stroke="#475569" stroke-width="1.5"/>
  <path d="M70 460 L160 458 L175 440 L190 380 L200 355" stroke="#dc2626" stroke-width="2.5" fill="none"/>
  <path d="M70 460 L60 462" stroke="#475569" stroke-width="1.5"/>
  <text x="150" y="378" font-size="11" fill="#dc2626">正向导通</text>
  <text x="78" y="440" font-size="11" fill="#64748b">反向截止</text>
  <text x="186" y="474" font-size="10.5" fill="#64748b">V</text>
  <text x="56" y="352" font-size="10.5" fill="#64748b">I</text>

  <rect x="333" y="305" width="273" height="180" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="350" y="328" font-size="12" font-weight="700" fill="#334155">MOS 电容 C-V（测氧化层/界面态）</text>
  <path d="M362 460 L362 355 L492 355" stroke="#475569" stroke-width="1.5"/>
  <path d="M362 385 L400 385 L420 420 L440 425 L470 425 L492 425" stroke="#2563eb" stroke-width="2.5" fill="none"/>
  <text x="440" y="380" font-size="10.5" fill="#2563eb">积累</text>
  <text x="440" y="445" font-size="10.5" fill="#2563eb">反型</text>
  <text x="478" y="474" font-size="10.5" fill="#64748b">Vg</text>
  <text x="350" y="352" font-size="10.5" fill="#64748b">C</text>

  <rect x="626" y="305" width="234" height="180" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="642" y="328" font-size="12" font-weight="700" fill="#334155">MOSFET Id-Vg（看 Vt）</text>
  <path d="M654 460 L654 355 L784 355" stroke="#475569" stroke-width="1.5"/>
  <path d="M654 452 L720 448 L740 400 L760 362 L784 358" stroke="#059669" stroke-width="2.5" fill="none"/>
  <circle cx="730" cy="424" r="4" fill="#dc2626"/>
  <path d="M730 424 L730 355" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="736" y="372" font-size="11" fill="#dc2626">Vt 阈值电压</text>
  <text x="790" y="474" font-size="10.5" fill="#64748b">Vg</text>
  <text x="642" y="352" font-size="10.5" fill="#64748b">Id</text>

  <!-- 提示条 -->
  <rect x="40" y="496" width="820" height="20" rx="5" fill="#fff7ed"/>
  <text x="56" y="510" font-size="11.5" fill="#9a3412">面试记忆点：掺杂浓度↑ → 电阻率↓、结击穿电压↓；温度↑ → 漏电↑、迁移率↓。PE 天天在跟"浓度、深度、均匀性"三个词打交道。</text>
</svg>
