<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" font-family="PingFang SC, Microsoft YaHei, Helvetica, Arial, sans-serif">
  <rect width="900" height="460" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">DOE 实验设计：用最少的片子找到最优参数</text>

  <!-- 对比 OFAT vs DOE -->
  <text x="40" y="64" font-size="14" font-weight="700" fill="#2563eb">为什么不用"一次只改一个变量"（OFAT）</text>
  <g>
    <rect x="40" y="78" width="400" height="150" rx="10" fill="#fee2e2" stroke="#dc2626"/>
    <text x="240" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">OFAT 单因子法</text>
    <text x="60" y="130" font-size="11.5" fill="#1e293b">固定 B，扫 A → 得到 A 的最优点</text>
    <text x="60" y="148" font-size="11.5" fill="#1e293b">再固定 A，扫 B → 得到 B 的最优点</text>
    <text x="60" y="172" font-size="11.5" fill="#dc2626">问题：A 与 B 有交互作用时结论是错的</text>
    <text x="60" y="190" font-size="11.5" fill="#dc2626">实验次数多、效率低、找不到全局最优</text>
    <text x="60" y="214" font-size="11.5" fill="#64748b">3 因子 3 水平：27 次实验仍看不清交互作用</text>
  </g>
  <g>
    <rect x="460" y="78" width="400" height="150" rx="10" fill="#d1fae5" stroke="#059669"/>
    <text x="660" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">DOE 实验设计</text>
    <text x="480" y="130" font-size="11.5" fill="#1e293b">同时改变多个因子，按矩阵安排组合</text>
    <text x="480" y="148" font-size="11.5" fill="#1e293b">能算出主效应 + 交互效应 + 曲率</text>
    <text x="480" y="172" font-size="11.5" fill="#059669">全因子 2³ = 8 次就能看交互作用</text>
    <text x="480" y="190" font-size="11.5" fill="#059669">加中心点可估计误差与弯曲</text>
    <text x="480" y="214" font-size="11.5" fill="#64748b">响应曲面 RSM / Taguchi 正交表更进一步</text>
  </g>

  <!-- 2^2 全因子示意 -->
  <text x="40" y="258" font-size="14" font-weight="700" fill="#7c3aed">两因子两水平全因子实验（2² = 4 组）</text>
  <rect x="40" y="272" width="400" height="170" rx="10" fill="#faf5ff" stroke="#c4b5fd"/>
  <g font-size="11.5">
    <rect x="60" y="290" width="160" height="130" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <line x1="80" y1="360" x2="200" y2="360" stroke="#475569" stroke-width="1.5"/>
    <line x1="80" y1="360" x2="80" y2="302" stroke="#475569" stroke-width="1.5"/>
    <text x="70" y="378" font-size="10" fill="#64748b">因子A低</text>
    <text x="150" y="378" font-size="10" fill="#64748b">因子A高</text>
    <text x="52" y="340" font-size="10" fill="#64748b">B低</text>
    <text x="52" y="308" font-size="10" fill="#64748b">B高</text>
    <circle cx="110" cy="340" r="5" fill="#2563eb"/>
    <text x="120" y="344" font-size="10" fill="#1e40af">Run1 (−,−)</text>
    <circle cx="170" cy="340" r="5" fill="#2563eb"/>
    <text x="180" y="344" font-size="10" fill="#1e40af">Run2 (+,−)</text>
    <circle cx="110" cy="308" r="5" fill="#dc2626"/>
    <text x="120" y="312" font-size="10" fill="#991b1b">Run3 (−,+)</text>
    <circle cx="170" cy="308" r="5" fill="#059669"/>
    <text x="180" y="312" font-size="10" fill="#065f46">Run4 (+,+)</text>
    <circle cx="140" cy="324" r="5" fill="#7c3aed"/>
    <text x="146" y="328" font-size="9.5" fill="#5b21b6">中心点×N</text>
  </g>
  <text x="240" y="290" font-size="10.5" fill="#64748b">四个角 + 中心点，就能拟合：</text>
  <text x="240" y="308" font-size="10.5" fill="#64748b">Y = β₀ + β₁A + β₂B + β₁₂AB</text>
  <text x="240" y="326" font-size="10.5" fill="#64748b">β₁₂ 显著 = A 与 B 有交互作用</text>
  <text x="240" y="344" font-size="10.5" fill="#64748b">+ 中心点显著偏离 → 存在曲率，需 RSM</text>
  <text x="240" y="372" font-size="10.5" fill="#334155">ANOVA 方差分析：判断哪个因子</text>
  <text x="240" y="388" font-size="10.5" fill="#334155">效应显著（p-value &lt; 0.05）</text>
  <text x="240" y="404" font-size="10.5" fill="#64748b">Residual 残差要随机，否则模型有问题</text>
  <text x="240" y="420" font-size="10.5" fill="#64748b">R² 与 R²(adj) 看拟合好坏</text>

  <!-- 流程 -->
  <text x="460" y="258" font-size="14" font-weight="700" fill="#059669">DOE 七步法（面试按这个顺序答）</text>
  <g font-size="11">
    <rect x="460" y="272" width="400" height="170" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="478" y="294" font-weight="700" fill="#065f46">1. 定义响应 Y</text><text x="620" y="294" fill="#1e293b">刻蚀速率？均匀性？选主 Y</text>
    <text x="478" y="314" font-weight="700" fill="#065f46">2. 选因子与水平</text><text x="620" y="314" fill="#1e293b">功率/压力/流量/温度</text>
    <text x="478" y="334" font-weight="700" fill="#065f46">3. 选设计</text><text x="620" y="334" fill="#1e293b">全因子 / 部分因子 / RSM</text>
    <text x="478" y="354" font-weight="700" fill="#065f46">4. 随机化 &amp; 分区组</text><text x="620" y="354" fill="#1e293b">防机台漂移混入</text>
    <text x="478" y="374" font-weight="700" fill="#065f46">5. 跑片 + 量测</text><text x="620" y="374" fill="#1e293b">注意量测重复性</text>
    <text x="478" y="394" font-weight="700" fill="#065f46">6. 建模 ANOVA</text><text x="620" y="394" fill="#1e293b">找显著因子与最优区间</text>
    <text x="478" y="414" font-weight="700" fill="#065f46">7. 验证 Confirmation</text><text x="620" y="414" fill="#1e293b">再跑 3~5 片确认可重复</text>
    <text x="478" y="434" font-size="10.5" fill="#64748b">软件：JMP、Minitab、Design-Expert、R</text>
  </g>

  <rect x="40" y="452" width="820" height="0" fill="none"/>
</svg>
