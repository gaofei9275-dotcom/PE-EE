<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" font-family="'PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif">
  <rect width="680" height="400" fill="#ffffff"/>
  <text x="24" y="30" font-size="19" font-weight="700" fill="#111827">芯片 = 几十亿个小开关 + 把它们连起来的金属线</text>

  <text x="24" y="58" font-size="13.5" font-weight="700" fill="#374151">① 一个晶体管 = 一个电控开关</text>
  <rect x="24" y="70" width="320" height="150" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <rect x="60" y="86" width="100" height="22" rx="3" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
  <text x="110" y="101" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">栅极 Gate（控制端）</text>
  <line x1="110" y1="108" x2="110" y2="132" stroke="#d97706" stroke-width="2"/>

  <rect x="44" y="132" width="42" height="44" rx="3" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="154" y="132" width="42" height="44" rx="3" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="65" y="158" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">源极</text>
  <text x="175" y="158" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">漏极</text>
  <rect x="86" y="142" width="48" height="24" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="110" y="158" font-size="10" font-weight="700" fill="#15803d" text-anchor="middle">沟道</text>

  <path d="M196 154 h24" stroke="#2563eb" stroke-width="2"/>
  <circle cx="234" cy="154" r="14" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
  <text x="234" y="159" font-size="12" text-anchor="middle">💡</text>
  <path d="M248 154 h30" stroke="#2563eb" stroke-width="2"/>
  <line x1="278" y1="142" x2="278" y2="166" stroke="#2563eb" stroke-width="3"/>

  <text x="170" y="200" font-size="11.5" fill="#0f172a" text-anchor="middle">栅极加电压 → 沟道出现 → 通电，灯亮（= 逻辑 1）</text>
  <text x="170" y="214" font-size="11" fill="#6b7280" text-anchor="middle">栅极不加压 → 沟道消失 → 断开（= 逻辑 0）</text>

  <text x="368" y="58" font-size="13.5" font-weight="700" fill="#374151">② 几十亿个拼起来 = 芯片</text>
  <rect x="368" y="70" width="288" height="150" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <g stroke-width="1">
    <rect x="382" y="86" width="26" height="18" rx="2" fill="#bfdbfe" stroke="#2563eb"/>
    <rect x="416" y="86" width="26" height="18" rx="2" fill="#dcfce7" stroke="#16a34a"/>
    <rect x="450" y="86" width="26" height="18" rx="2" fill="#bfdbfe" stroke="#2563eb"/>
    <rect x="484" y="86" width="26" height="18" rx="2" fill="#dcfce7" stroke="#16a34a"/>
    <rect x="518" y="86" width="26" height="18" rx="2" fill="#bfdbfe" stroke="#2563eb"/>
    <rect x="552" y="86" width="26" height="18" rx="2" fill="#dcfce7" stroke="#16a34a"/>
    <rect x="586" y="86" width="26" height="18" rx="2" fill="#bfdbfe" stroke="#2563eb"/>
    <rect x="620" y="86" width="26" height="18" rx="2" fill="#dcfce7" stroke="#16a34a"/>
    <rect x="382" y="112" width="26" height="18" rx="2" fill="#dcfce7" stroke="#16a34a"/>
    <rect x="416" y="112" width="26" height="18" rx="2" fill="#bfdbfe" stroke="#2563eb"/>
    <rect x="450" y="112" width="26" height="18" rx="2" fill="#dcfce7" stroke="#16a34a"/>
    <rect x="484" y="112" width="26" height="18" rx="2" fill="#bfdbfe" stroke="#2563eb"/>
    <rect x="518" y="112" width="26" height="18" rx="2" fill="#dcfce7" stroke="#16a34a"/>
    <rect x="552" y="112" width="26" height="18" rx="2" fill="#bfdbfe" stroke="#2563eb"/>
    <rect x="586" y="112" width="26" height="18" rx="2" fill="#dcfce7" stroke="#16a34a"/>
    <rect x="620" y="112" width="26" height="18" rx="2" fill="#bfdbfe" stroke="#2563eb"/>
    <rect x="382" y="138" width="26" height="18" rx="2" fill="#bfdbfe" stroke="#2563eb"/>
    <rect x="416" y="138" width="26" height="18" rx="2" fill="#dcfce7" stroke="#16a34a"/>
    <rect x="450" y="138" width="26" height="18" rx="2" fill="#bfdbfe" stroke="#2563eb"/>
    <rect x="484" y="138" width="26" height="18" rx="2" fill="#dcfce7" stroke="#16a34a"/>
    <rect x="518" y="138" width="26" height="18" rx="2" fill="#bfdbfe" stroke="#2563eb"/>
    <rect x="552" y="138" width="26" height="18" rx="2" fill="#dcfce7" stroke="#16a34a"/>
    <rect x="586" y="138" width="26" height="18" rx="2" fill="#bfdbfe" stroke="#2563eb"/>
    <rect x="620" y="138" width="26" height="18" rx="2" fill="#dcfce7" stroke="#16a34a"/>
    <rect x="382" y="164" width="26" height="18" rx="2" fill="#dcfce7" stroke="#16a34a"/>
    <rect x="416" y="164" width="26" height="18" rx="2" fill="#bfdbfe" stroke="#2563eb"/>
    <rect x="450" y="164" width="26" height="18" rx="2" fill="#dcfce7" stroke="#16a34a"/>
    <rect x="484" y="164" width="26" height="18" rx="2" fill="#bfdbfe" stroke="#2563eb"/>
    <rect x="518" y="164" width="26" height="18" rx="2" fill="#dcfce7" stroke="#16a34a"/>
    <rect x="552" y="164" width="26" height="18" rx="2" fill="#bfdbfe" stroke="#2563eb"/>
    <rect x="586" y="164" width="26" height="18" rx="2" fill="#dcfce7" stroke="#16a34a"/>
    <rect x="620" y="164" width="26" height="18" rx="2" fill="#bfdbfe" stroke="#2563eb"/>
  </g>
  <text x="512" y="200" font-size="11.5" fill="#334155" text-anchor="middle">每个小方块 = 一个开关；横竖的线 = 铜导线</text>
  <text x="512" y="214" font-size="11" fill="#6b7280" text-anchor="middle">谁开谁关，就代表 0 和 1 —— 计算就是这么来的</text>

  <text x="24" y="252" font-size="13.5" font-weight="700" fill="#374151">③ 把芯片想成一座立体城市，就全通了</text>
  <rect x="24" y="264" width="632" height="112" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <g font-size="12" fill="#7c2d12">
    <text x="44" y="290">晶体管 = 楼房里的开关（几十亿个）</text>
    <text x="44" y="312">铜导线 = 道路（越细越堵，所以要低电阻的铜）</text>
    <text x="44" y="334">绝缘层 = 楼板（防止上下层短路）</text>
    <text x="340" y="290">FEOL = 先盖房子（做晶体管）</text>
    <text x="340" y="312">BEOL = 再修路网（连金属线）</text>
    <text x="340" y="334">CMP = 每层盖完都磨平，不然楼会歪</text>
  </g>
</svg>
