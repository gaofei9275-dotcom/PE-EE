<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" font-family="PingFang SC, Microsoft YaHei, Helvetica, Arial, sans-serif">
  <rect width="900" height="480" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">CMP 与双大马士革：把表面磨平，再把铜"填"进去</text>

  <!-- CMP 原理 -->
  <g>
    <rect x="40" y="52" width="430" height="230" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="255" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#0891b2">CMP 化学机械抛光</text>
    <!-- 抛光头与垫 -->
    <rect x="90" y="94" width="150" height="24" rx="4" fill="#475569"/>
    <text x="165" y="111" text-anchor="middle" font-size="10.5" fill="#ffffff">Polishing Head 抛光头（下压）</text>
    <rect x="90" y="118" width="150" height="18" fill="#fbbf24"/>
    <text x="165" y="132" text-anchor="middle" font-size="9.5" fill="#78350f">Wafer 晶圆（面朝下）</text>

    <rect x="70" y="152" width="330" height="26" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="235" y="170" text-anchor="middle" font-size="10.5" fill="#334155">Polishing Pad 抛光垫（多孔聚氨酯）</text>
    <circle cx="400" cy="140" r="14" fill="#a7f3d0" stroke="#059669"/>
    <text x="400" y="144" text-anchor="middle" font-size="9" fill="#065f46">Slurry</text>
    <text x="400" y="152" text-anchor="middle" font-size="8" fill="#065f46">研磨液</text>
    <path d="M386 140 q-16 -14 -34 -8" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#c1)"/>

    <text x="60" y="204" font-size="11.5" fill="#334155">化学：Slurry 与表面反应生成软层</text>
    <text x="60" y="222" font-size="11.5" fill="#334155">机械：磨粒 + 抛光垫把软层磨掉</text>
    <text x="60" y="240" font-size="11.5" fill="#64748b">两者循环，实现全局平坦化（不只是"磨平"，而是"全局"平整）</text>
    <text x="60" y="264" font-size="11.5" fill="#dc2626">常见缺陷：Dishing 碟形凹陷（软金属磨多了）</text>
    <text x="60" y="280" font-size="11.5" fill="#dc2626">Erosion 侵蚀（密集图形区整体磨多）、Scratch 划伤、残留颗粒</text>
    <defs><marker id="c1" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#059669"/></marker></defs>
  </g>

  <!-- Preston 方程 -->
  <g>
    <rect x="490" y="52" width="370" height="230" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="675" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">Preston 方程：速率由什么决定</text>
    <text x="675" y="128" text-anchor="middle" font-size="19" font-weight="700" fill="#1e40af">RR = k · P · V</text>
    <g font-size="11.5" fill="#1e293b">
      <text x="510" y="156">RR：去除速率 Removal Rate</text>
      <text x="510" y="176">P：下压力 Down Force</text>
      <text x="510" y="196">V：相对转速</text>
      <text x="510" y="216">k：Preston 系数（浆料/垫/膜层决定）</text>
    </g>
    <text x="510" y="244" font-size="11.5" fill="#64748b">调节手段：压力分区（多区头）、转速比、浆料流量、</text>
    <text x="510" y="262" font-size="11.5" fill="#64748b">垫修整（Conditioning）、终点检测（电机电流/光学）</text>
    <text x="510" y="282" font-size="11.5" fill="#1e40af">国产化亮点：华海清科是国内 CMP 龙头</text>
  </g>

  <!-- 双大马士革 -->
  <text x="40" y="308" font-size="14" font-weight="700" fill="#059669">双大马士革 Dual Damascene：一次把 Via 和沟槽都填上铜</text>

  <g font-size="10.5">
    <rect x="40" y="322" width="130" height="118" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <rect x="50" y="340" width="110" height="34" fill="#e2e8f0"/>
    <rect x="50" y="374" width="110" height="34" fill="#cbd5e1"/>
    <text x="105" y="428" text-anchor="middle" font-weight="700" fill="#334155">① 介质层</text>
    <text x="105" y="440" text-anchor="middle" fill="#64748b">SiO₂ / Low-k</text>

    <rect x="182" y="322" width="130" height="118" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <rect x="192" y="340" width="110" height="34" fill="#e2e8f0"/>
    <rect x="192" y="374" width="110" height="34" fill="#cbd5e1"/>
    <rect x="212" y="374" width="20" height="34" fill="#ffffff"/>
    <text x="247" y="428" text-anchor="middle" font-weight="700" fill="#334155">② Via 孔</text>
    <text x="247" y="440" text-anchor="middle" fill="#64748b">先刻小孔</text>

    <rect x="324" y="322" width="130" height="118" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <rect x="334" y="340" width="110" height="34" fill="#e2e8f0"/>
    <rect x="354" y="340" width="70" height="34" fill="#ffffff"/>
    <rect x="334" y="374" width="110" height="34" fill="#cbd5e1"/>
    <rect x="354" y="374" width="20" height="34" fill="#ffffff"/>
    <text x="389" y="428" text-anchor="middle" font-weight="700" fill="#334155">③ 沟槽 Trench</text>
    <text x="389" y="440" text-anchor="middle" fill="#64748b">再刻上面一条</text>

    <rect x="466" y="322" width="130" height="118" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <rect x="476" y="340" width="110" height="34" fill="#e2e8f0"/>
    <rect x="496" y="340" width="70" height="34" fill="#fb923c"/>
    <rect x="476" y="374" width="110" height="34" fill="#cbd5e1"/>
    <rect x="496" y="374" width="20" height="34" fill="#fb923c"/>
    <rect x="476" y="336" width="110" height="4" fill="#fb923c"/>
    <text x="531" y="428" text-anchor="middle" font-weight="700" fill="#c2410c">④ 电镀铜填充</text>
    <text x="531" y="440" text-anchor="middle" fill="#64748b">PVD 籽晶层 + ECP</text>

    <rect x="608" y="322" width="130" height="118" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <rect x="618" y="340" width="110" height="34" fill="#e2e8f0"/>
    <rect x="638" y="358" width="70" height="16" fill="#fb923c"/>
    <rect x="618" y="374" width="110" height="34" fill="#cbd5e1"/>
    <rect x="638" y="374" width="20" height="34" fill="#fb923c"/>
    <text x="673" y="428" text-anchor="middle" font-weight="700" fill="#334155">⑤ CMP 磨平</text>
    <text x="673" y="440" text-anchor="middle" fill="#64748b">磨掉表面多余铜</text>

    <rect x="750" y="322" width="110" height="118" rx="8" fill="#d1fae5" stroke="#059669"/>
    <rect x="760" y="340" width="90" height="34" fill="#e2e8f0"/>
    <rect x="780" y="358" width="50" height="16" fill="#fb923c"/>
    <rect x="760" y="374" width="90" height="34" fill="#cbd5e1"/>
    <rect x="780" y="374" width="20" height="34" fill="#fb923c"/>
    <text x="805" y="428" text-anchor="middle" font-weight="700" fill="#065f46">⑥ 完成</text>
    <text x="805" y="440" text-anchor="middle" fill="#64748b">Mx 层</text>
  </g>
  <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#c2)">
    <path d="M170 381 L180 381"/><path d="M312 381 L322 381"/><path d="M454 381 L464 381"/>
    <path d="M596 381 L606 381"/><path d="M738 381 L748 381"/>
  </g>
  <defs><marker id="c2" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#94a3b8"/></marker></defs>

  <rect x="40" y="452" width="820" height="22" rx="8" fill="#fff7ed" stroke="#fb923c"/>
  <text x="58" y="467" font-size="11.5" fill="#9a3412">为什么用铜不用铝？电阻率更低、抗电迁移更好；但铜会扩散污染硅，必须先用 TaN/Ta 做阻挡层（Barrier）+ 籽晶层，且不能用干法刻蚀 → 才有了大马士革工艺。</text>
</svg>
