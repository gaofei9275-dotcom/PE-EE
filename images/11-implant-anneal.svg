<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" font-family="PingFang SC, Microsoft YaHei, Helvetica, Arial, sans-serif">
  <rect width="900" height="460" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">离子注入 + 退火：把杂质"射"进硅里，再修好晶格</text>

  <!-- 注入机示意 -->
  <text x="40" y="64" font-size="14" font-weight="700" fill="#2563eb">离子注入机 Implanter 的五大段</text>
  <g font-size="11">
    <rect x="40" y="78" width="150" height="52" rx="8" fill="#fee2e2" stroke="#dc2626"/>
    <text x="115" y="100" text-anchor="middle" font-weight="700" fill="#991b1b">离子源 Source</text>
    <text x="115" y="118" text-anchor="middle" fill="#334155">BF₃ / AsH₃ / PH₃ 电离</text>

    <rect x="200" y="78" width="140" height="52" rx="8" fill="#fef3c7" stroke="#d97706"/>
    <text x="270" y="100" text-anchor="middle" font-weight="700" fill="#92400e">分析磁铁</text>
    <text x="270" y="118" text-anchor="middle" fill="#334155">按质荷比选出离子</text>

    <rect x="350" y="78" width="140" height="52" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="420" y="100" text-anchor="middle" font-weight="700" fill="#1e40af">加速管</text>
    <text x="420" y="118" text-anchor="middle" fill="#334155">高压决定能量 keV</text>

    <rect x="500" y="78" width="140" height="52" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="570" y="100" text-anchor="middle" font-weight="700" fill="#5b21b6">扫描 / 束流整形</text>
    <text x="570" y="118" text-anchor="middle" fill="#334155">均匀扫过整片</text>

    <rect x="650" y="78" width="210" height="52" rx="8" fill="#d1fae5" stroke="#059669"/>
    <text x="755" y="100" text-anchor="middle" font-weight="700" fill="#065f46">End Station 靶室</text>
    <text x="755" y="118" text-anchor="middle" fill="#334155">晶圆盘（高速旋转/倾斜）</text>
  </g>
  <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#i1)">
    <path d="M190 104 L198 104"/><path d="M340 104 L348 104"/><path d="M490 104 L498 104"/><path d="M640 104 L648 104"/>
  </g>
  <defs><marker id="i1" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#94a3b8"/></marker></defs>

  <!-- 注入剖面 -->
  <text x="40" y="160" font-size="14" font-weight="700" fill="#059669">注入剖面：高斯分布，能量定深度、剂量定浓度</text>
  <rect x="40" y="174" width="420" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <path d="M70 300 L70 200 L400 200" stroke="#475569" stroke-width="1.5"/>
  <!-- 高斯曲线 -->
  <path d="M70 292 C140 292 160 214 210 214 C260 214 280 292 400 292" stroke="#2563eb" stroke-width="2.5" fill="none"/>
  <path d="M210 214 L210 292" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="220" y="232" font-size="11" fill="#dc2626">Rp 投影射程</text>
  <path d="M120 214 L120 292" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="80" y="232" font-size="11" fill="#7c3aed">ΔRp 离散</text>
  <text x="200" y="316" font-size="11" fill="#334155">深度（能量↑ → Rp↑）</text>
  <text x="60" y="196" font-size="11" fill="#334155">浓度</text>
  <text x="250" y="326" font-size="11" fill="#64748b">剂量 Dose（cm⁻²）↑ → 整条曲线抬高</text>

  <!-- 损伤与退火 -->
  <text x="490" y="160" font-size="14" font-weight="700" fill="#d97706">注入会打坏晶格 → 必须退火修复并激活</text>
  <rect x="490" y="174" width="370" height="150" rx="10" fill="#fff7ed" stroke="#fb923c"/>
  <g>
    <text x="506" y="198" font-size="11.5" fill="#334155">注入后：晶格损伤、杂质在间隙位（未激活）</text>
    <g>
      <circle cx="530" cy="222" r="3" fill="#475569"/><circle cx="550" cy="222" r="3" fill="#475569"/>
      <circle cx="570" cy="222" r="3" fill="#dc2626"/><circle cx="590" cy="222" r="3" fill="#475569"/>
      <circle cx="610" cy="222" r="3" fill="#475569"/><circle cx="630" cy="222" r="3" fill="#dc2626"/>
      <circle cx="650" cy="222" r="3" fill="#475569"/><circle cx="670" cy="222" r="3" fill="#475569"/>
    </g>
    <text x="690" y="226" font-size="10.5" fill="#dc2626">红=损伤/间隙原子</text>

    <path d="M600 238 L600 252" stroke="#059669" stroke-width="2.5" marker-end="url(#i2)"/>
    <text x="612" y="250" font-size="10.5" fill="#059669">退火</text>

    <g>
      <circle cx="530" cy="272" r="3" fill="#475569"/><circle cx="550" cy="272" r="3" fill="#475569"/>
      <circle cx="570" cy="272" r="3" fill="#059669"/><circle cx="590" cy="272" r="3" fill="#475569"/>
      <circle cx="610" cy="272" r="3" fill="#475569"/><circle cx="630" cy="272" r="3" fill="#059669"/>
      <circle cx="650" cy="272" r="3" fill="#475569"/><circle cx="670" cy="272" r="3" fill="#475569"/>
    </g>
    <text x="690" y="276" font-size="10.5" fill="#059669">绿=替位、已激活</text>
    <defs><marker id="i2" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#059669"/></marker></defs>
    <text x="506" y="306" font-size="11.5" fill="#64748b">副作用：杂质会扩散（再分布），浅结难做</text>
  </g>

  <!-- 退火方式 -->
  <text x="40" y="352" font-size="14" font-weight="700" fill="#7c3aed">退火方式：核心矛盾是「修复」与「扩散」的赛跑</text>
  <g font-size="11.5">
    <rect x="40" y="366" width="270" height="66" rx="8" fill="#faf5ff" stroke="#c4b5fd"/>
    <text x="56" y="388" font-weight="700" fill="#5b21b6">炉管退火 Furnace</text>
    <text x="56" y="406" fill="#1e293b">600~900℃，数十分钟</text>
    <text x="56" y="424" fill="#64748b">扩散大，用于非关键层</text>

    <rect x="325" y="366" width="270" height="66" rx="8" fill="#faf5ff" stroke="#c4b5fd"/>
    <text x="341" y="388" font-weight="700" fill="#5b21b6">RTA 快速热退火</text>
    <text x="341" y="406" fill="#1e293b">1000℃+，秒级（灯加热）</text>
    <text x="341" y="424" fill="#64748b">扩散小，先进节点主流</text>

    <rect x="610" y="366" width="250" height="66" rx="8" fill="#faf5ff" stroke="#c4b5fd"/>
    <text x="626" y="388" font-weight="700" fill="#5b21b6">激光 / 闪光退火</text>
    <text x="626" y="406" fill="#1e293b">毫秒~微秒级</text>
    <text x="626" y="424" fill="#64748b">几乎零扩散，超浅结</text>
  </g>

  <rect x="40" y="440" width="820" height="16" rx="5" fill="#eff6ff"/>
  <text x="58" y="452" font-size="11" fill="#1e40af">注入 PE 的 KPI：Rs（方块电阻）、结深 Xj、剂量均匀性、轮廓（Channeling 沟道效应 → 需预非晶化 PAI + 7° 倾角）。</text>
</svg>
