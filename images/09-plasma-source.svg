<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" font-family="PingFang SC, Microsoft YaHei, Helvetica, Arial, sans-serif">
  <rect width="900" height="460" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">等离子体从哪来：CCP 与 ICP 两种激发方式（EE 必懂）</text>

  <!-- CCP -->
  <g>
    <rect x="40" y="54" width="420" height="240" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="250" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#2563eb">CCP 电容耦合（Capacitively Coupled Plasma）</text>

    <!-- 上电极 -->
    <rect x="90" y="100" width="320" height="20" fill="#94a3b8"/>
    <text x="250" y="115" text-anchor="middle" font-size="11" fill="#ffffff">上电极（接 RF）</text>
    <!-- 等离子体区 -->
    <rect x="90" y="120" width="320" height="66" fill="#fecaca"/>
    <text x="250" y="155" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">等离子体 Plasma</text>
    <g fill="#7c3aed">
      <circle cx="150" cy="140" r="3"/><circle cx="200" cy="152" r="3"/><circle cx="250" cy="138" r="3"/>
      <circle cx="300" cy="150" r="3"/><circle cx="350" cy="142" r="3"/><circle cx="380" cy="155" r="3"/>
    </g>
    <!-- 下电极/晶圆 -->
    <rect x="150" y="186" width="200" height="14" fill="#475569"/>
    <text x="250" y="197" text-anchor="middle" font-size="10" fill="#ffffff">下电极 / ESC（承载晶圆）</text>

    <!-- RF 源 -->
    <rect x="430" y="96" width="0" height="0"/>
    <path d="M410 110 L440 110 L440 160 L410 160" stroke="#dc2626" stroke-width="2" fill="none"/>
    <text x="418" y="180" font-size="11" fill="#dc2626">RF</text>

    <text x="60" y="228" font-size="11.5" fill="#334155">两块极板像电容，射频电场直接加在气体上击穿</text>
    <text x="60" y="246" font-size="11.5" fill="#334155">特点：结构最简单；离子能量高、密度中等</text>
    <text x="60" y="264" font-size="11.5" fill="#64748b">典型：介质刻蚀（氧化硅/氮化硅），13.56 MHz</text>
    <text x="60" y="282" font-size="11.5" fill="#64748b">缺点：离子密度与能量耦合，无法独立调节</text>
  </g>

  <!-- ICP -->
  <g>
    <rect x="480" y="54" width="380" height="240" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="670" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#059669">ICP 电感耦合（Inductively Coupled Plasma）</text>

    <!-- 线圈 -->
    <path d="M540 100 q20 -18 40 0 q20 18 40 0 q20 -18 40 0 q20 18 40 0 q20 -18 40 0 q20 18 40 0 q20 -18 40 0" stroke="#0d9488" stroke-width="3" fill="none"/>
    <text x="670" y="120" text-anchor="middle" font-size="10.5" fill="#0d9488">感应线圈（RF 天线，在腔体外）</text>

    <rect x="530" y="118" width="280" height="14" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="670" y="129" text-anchor="middle" font-size="9.5" fill="#334155">介质窗（石英 / 陶瓷）</text>

    <rect x="530" y="132" width="280" height="66" fill="#a7f3d0"/>
    <text x="670" y="166" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">高密度等离子体</text>
    <g fill="#7c3aed">
      <circle cx="570" cy="150" r="3"/><circle cx="610" cy="165" r="3"/><circle cx="650" cy="148" r="3"/>
      <circle cx="690" cy="168" r="3"/><circle cx="730" cy="152" r="3"/><circle cx="770" cy="166" r="3"/>
    </g>

    <rect x="590" y="198" width="160" height="14" fill="#475569"/>
    <text x="670" y="209" text-anchor="middle" font-size="10" fill="#ffffff">下电极（Bias RF 独立）</text>

    <text x="500" y="228" font-size="11.5" fill="#334155">线圈感应出交变磁场 → 感生电场 → 电离气体</text>
    <text x="500" y="246" font-size="11.5" fill="#334155">特点：等离子体密度高 10~100 倍，低压下也能稳定</text>
    <text x="500" y="264" font-size="11.5" fill="#64748b">下电极另加一路 Bias RF 控离子能量 → 密度/能量解耦</text>
    <text x="500" y="282" font-size="11.5" fill="#64748b">典型：硅/金属刻蚀、高深宽比刻蚀</text>
  </g>

  <!-- RF 系统 -->
  <text x="40" y="320" font-size="14" font-weight="700" fill="#d97706">RF 系统三件套：电源 → 匹配器 → 负载（EE 排障重灾区）</text>

  <rect x="40" y="334" width="820" height="86" rx="10" fill="#fff7ed" stroke="#fb923c"/>
  <g>
    <rect x="60" y="352" width="150" height="50" rx="8" fill="#fee2e2" stroke="#dc2626"/>
    <text x="135" y="374" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">RF Generator</text>
    <text x="135" y="392" text-anchor="middle" font-size="10.5" fill="#334155">射频电源 13.56MHz</text>

    <rect x="240" y="352" width="170" height="50" rx="8" fill="#fef3c7" stroke="#d97706"/>
    <text x="325" y="374" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">Match 匹配网络</text>
    <text x="325" y="392" text-anchor="middle" font-size="10.5" fill="#334155">两个可变电容自动调</text>

    <rect x="440" y="352" width="150" height="50" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="515" y="374" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">Chamber 腔体</text>
    <text x="515" y="392" text-anchor="middle" font-size="10.5" fill="#334155">等离子体（负载）</text>

    <rect x="620" y="352" width="220" height="50" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="730" y="374" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">反射功率 Reflected Power</text>
    <text x="730" y="392" text-anchor="middle" font-size="10.5" fill="#64748b">阻抗失配 → 功率打不进腔体</text>
  </g>
  <path d="M210 377 L238 377" stroke="#94a3b8" stroke-width="2" marker-end="url(#r1)"/>
  <path d="M410 377 L438 377" stroke="#94a3b8" stroke-width="2" marker-end="url(#r1)"/>
  <path d="M590 377 L618 377" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#r2)"/>
  <defs>
    <marker id="r1" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#94a3b8"/></marker>
    <marker id="r2" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/></marker>
  </defs>

  <rect x="40" y="428" width="820" height="26" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="58" y="445" font-size="11.5" fill="#1e40af">排障口诀：反射功率高 → 查匹配器电容是否卡死/磨损、电缆接头、腔壁沉积物改变阻抗、气压异常；用 V/I 探头看谐波可判断腔体状态。</text>
</svg>
