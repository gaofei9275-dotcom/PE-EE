<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" width="680" height="470" font-family="'PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif">
  <rect width="680" height="470" fill="#ffffff"/>
  <text x="24" y="30" font-size="19" font-weight="700" fill="#111827">导电的本质：电子"跑不跑得动"；水管就是最好的类比</text>

  <!-- ===== 上半：三种材料 ===== -->
  <text x="24" y="58" font-size="13.5" font-weight="700" fill="#374151">① 材料分三类，区别只在一个字：电子跑不跑得动</text>

  <!-- 导体 -->
  <g>
    <rect x="24" y="70" width="200" height="150" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="124" y="92" font-size="14" font-weight="700" fill="#1d4ed8" text-anchor="middle">导体（铜、铝）</text>
    <text x="124" y="110" font-size="11" fill="#1e40af" text-anchor="middle">电子像"自由人"，到处乱跑</text>
    <g fill="#1d4ed8" opacity="0.85">
      <circle cx="60" cy="140" r="4"/><circle cx="95" cy="128" r="4"/><circle cx="130" cy="148" r="4"/>
      <circle cx="165" cy="132" r="4"/><circle cx="55" cy="168" r="4"/><circle cx="100" cy="180" r="4"/>
      <circle cx="145" cy="170" r="4"/><circle cx="185" cy="180" r="4"/><circle cx="190" cy="150" r="4"/>
      <circle cx="80" cy="196" r="4"/><circle cx="160" cy="200" r="4"/>
    </g>
    <g stroke="#93c5fd" stroke-width="1" stroke-dasharray="2 3" fill="none">
      <path d="M60 140 L95 128 L130 148 L165 132 L190 150"/>
      <path d="M55 168 L100 180 L145 170 L185 180"/>
    </g>
    <text x="124" y="212" font-size="11" fill="#1e3a8a" text-anchor="middle">一通电 → 立刻导</text>
  </g>

  <!-- 半导体 -->
  <g>
    <rect x="240" y="70" width="200" height="150" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="340" y="92" font-size="14" font-weight="700" fill="#15803d" text-anchor="middle">半导体（硅）★主角</text>
    <text x="340" y="110" font-size="11" fill="#166534" text-anchor="middle">电子平时被"拴住"，可以被放开</text>
    <g fill="#166534">
      <circle cx="276" cy="140" r="6" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
      <circle cx="340" cy="140" r="6" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
      <circle cx="404" cy="140" r="6" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
      <circle cx="276" cy="186" r="6" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
      <circle cx="340" cy="186" r="6" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
      <circle cx="404" cy="186" r="6" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
    </g>
    <g fill="#15803d" font-size="9.5" text-anchor="middle">
      <text x="276" y="162">Si</text><text x="340" y="162">Si</text><text x="404" y="162">Si</text>
      <text x="276" y="208">Si</text><text x="340" y="208">Si</text><text x="404" y="208">Si</text>
    </g>
    <circle cx="308" cy="163" r="3.5" fill="#dc2626"/>
    <circle cx="372" cy="163" r="3.5" fill="#dc2626"/>
    <text x="340" y="216" font-size="11" font-weight="600" fill="#15803d" text-anchor="middle">掺点杂质 / 加电压 / 照光 → 就导电</text>
  </g>

  <!-- 绝缘体 -->
  <g>
    <rect x="456" y="70" width="200" height="150" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="556" y="92" font-size="14" font-weight="700" fill="#b91c1c" text-anchor="middle">绝缘体（SiO₂、胶）</text>
    <text x="556" y="110" font-size="11" fill="#991b1b" text-anchor="middle">电子被"焊死"，推都推不动</text>
    <g>
      <circle cx="496" cy="140" r="6" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/>
      <circle cx="556" cy="140" r="6" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/>
      <circle cx="616" cy="140" r="6" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/>
      <circle cx="496" cy="186" r="6" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/>
      <circle cx="556" cy="186" r="6" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/>
      <circle cx="616" cy="186" r="6" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/>
    </g>
    <g stroke="#fca5a5" stroke-width="2">
      <line x1="506" y1="140" x2="546" y2="140"/><line x1="566" y1="140" x2="606" y2="140"/>
      <line x1="506" y1="186" x2="546" y2="186"/><line x1="566" y1="186" x2="606" y2="186"/>
      <line x1="496" y1="150" x2="496" y2="176"/><line x1="556" y1="150" x2="556" y2="176"/>
    </g>
    <text x="556" y="212" font-size="11" fill="#991b1b" text-anchor="middle">电压再高也几乎不导</text>
  </g>

  <!-- ===== 下半：水管类比 ===== -->
  <text x="24" y="256" font-size="13.5" font-weight="700" fill="#374151">② 电路 = 水管系统：这套类比能吃掉 80% 的电学概念</text>

  <rect x="24" y="272" width="632" height="176" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- 水泵 = 电压 -->
  <g>
    <circle cx="80" cy="360" r="24" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="80" y="356" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">水泵</text>
    <text x="80" y="370" font-size="9.5" fill="#1e40af" text-anchor="middle">提供压力</text>
    <text x="80" y="404" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">电压 V</text>
    <text x="80" y="420" font-size="10" fill="#6b7280" text-anchor="middle">推动电子的"压力"</text>
  </g>

  <!-- 管道 -->
  <rect x="104" y="352" width="180" height="16" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.5"/>
  <g fill="#1d4ed8">
    <circle cx="130" cy="360" r="3.5"/><circle cx="160" cy="360" r="3.5"/>
    <circle cx="190" cy="360" r="3.5"/><circle cx="220" cy="360" r="3.5"/><circle cx="250" cy="360" r="3.5"/>
  </g>
  <text x="194" y="344" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">电流 I = 流动的电子</text>
  <text x="194" y="386" font-size="10" fill="#6b7280" text-anchor="middle">水流量</text>

  <!-- 阀门 = 电阻 -->
  <g>
    <rect x="284" y="340" width="16" height="40" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
    <line x1="292" y1="330" x2="292" y2="340" stroke="#d97706" stroke-width="2"/>
    <circle cx="292" cy="326" r="6" fill="#fed7aa" stroke="#d97706" stroke-width="1.5"/>
    <text x="292" y="404" font-size="12" font-weight="700" fill="#b45309" text-anchor="middle">电阻 R</text>
    <text x="292" y="420" font-size="10" fill="#6b7280" text-anchor="middle">细管 / 阀门</text>
  </g>
  <rect x="300" y="352" width="120" height="16" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.5"/>

  <!-- 水龙头 = MOSFET -->
  <g>
    <rect x="420" y="330" width="70" height="52" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="455" y="352" font-size="11.5" font-weight="700" fill="#15803d" text-anchor="middle">水龙头</text>
    <text x="455" y="368" font-size="10" fill="#166534" text-anchor="middle">（拧一下就通）</text>
    <line x1="490" y1="356" x2="530" y2="356" stroke="#16a34a" stroke-width="3"/>
    <line x1="530" y1="356" x2="530" y2="376" stroke="#16a34a" stroke-width="3"/>
    <path d="M524 376 h12 l-3 10 h-6 z" fill="#16a34a"/>
    <text x="455" y="404" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle">MOSFET</text>
    <text x="455" y="420" font-size="10" fill="#6b7280" text-anchor="middle">栅极一加压就"开"</text>
  </g>

  <!-- 水箱 = 电容 -->
  <g>
    <rect x="556" y="336" width="60" height="40" rx="4" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
    <rect x="556" y="356" width="60" height="20" rx="2" fill="#a5b4fc" opacity="0.8"/>
    <text x="586" y="352" font-size="10.5" font-weight="700" fill="#4338ca" text-anchor="middle">水箱</text>
    <text x="586" y="404" font-size="12" font-weight="700" fill="#4338ca" text-anchor="middle">电容 C</text>
    <text x="586" y="420" font-size="10" fill="#6b7280" text-anchor="middle">存电荷</text>
  </g>

  <text x="340" y="300" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">欧姆定律：电流 = 电压 ÷ 电阻　→　水流量 = 水压 ÷ 管子阻力</text>
</svg>
