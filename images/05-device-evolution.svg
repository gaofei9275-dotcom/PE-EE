<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" font-family="PingFang SC, Microsoft YaHei, Helvetica, Arial, sans-serif">
  <rect width="900" height="460" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">器件演进：栅极对沟道的"包围程度"决定一切</text>

  <!-- Planar -->
  <g>
    <rect x="40" y="70" width="250" height="200" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="165" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Planar 平面型</text>
    <text x="165" y="116" text-anchor="middle" font-size="11" fill="#64748b">~28nm 及以上主流</text>
    <rect x="80" y="140" width="170" height="18" fill="#475569"/>
    <text x="165" y="154" text-anchor="middle" font-size="10.5" fill="#ffffff">Gate</text>
    <rect x="95" y="158" width="140" height="12" fill="#fef3c7" stroke="#d97706"/>
    <rect x="80" y="170" width="170" height="60" fill="#e2e8f0"/>
    <rect x="105" y="176" width="120" height="10" fill="#d1fae5" stroke="#059669"/>
    <rect x="80" y="170" width="26" height="60" fill="#fee2e2"/>
    <rect x="224" y="170" width="26" height="60" fill="#fee2e2"/>
    <text x="93" y="212" font-size="9" fill="#991b1b">S</text>
    <text x="237" y="212" font-size="9" fill="#991b1b">D</text>
    <text x="165" y="248" text-anchor="middle" font-size="11.5" fill="#dc2626">栅极只从 1 面控制沟道</text>
    <text x="165" y="264" text-anchor="middle" font-size="11.5" fill="#64748b">沟道短了就漏，撑不住</text>
  </g>

  <!-- FinFET -->
  <g>
    <rect x="325" y="70" width="250" height="200" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="450" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">FinFET 鳍式</text>
    <text x="450" y="116" text-anchor="middle" font-size="11" fill="#64748b">22nm ~ 3nm 主力（台积电/三星）</text>
    <!-- 三个鳍 -->
    <rect x="370" y="140" width="18" height="86" fill="#e2e8f0" stroke="#94a3b8"/>
    <rect x="420" y="140" width="18" height="86" fill="#e2e8f0" stroke="#94a3b8"/>
    <rect x="470" y="140" width="18" height="86" fill="#e2e8f0" stroke="#94a3b8"/>
    <rect x="355" y="150" width="160" height="16" fill="#475569"/>
    <text x="435" y="163" text-anchor="middle" font-size="10" fill="#ffffff">Gate 跨过鳍（三面包围）</text>
    <rect x="358" y="226" width="158" height="14" fill="#cbd5e1"/>
    <text x="437" y="238" text-anchor="middle" font-size="9.5" fill="#334155">STI 浅沟槽隔离</text>
    <path d="M388 132 L388 128" stroke="none"/>
    <text x="450" y="258" text-anchor="middle" font-size="11.5" fill="#059669">栅极从 3 面（左/顶/右）控制</text>
    <text x="450" y="276" text-anchor="middle" font-size="11.5" fill="#64748b">控制力强，漏电小；但 Fin 宽度受光刻限制</text>
  </g>

  <!-- GAA -->
  <g>
    <rect x="610" y="70" width="250" height="200" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="735" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">GAA 环绕栅 / 纳米片</text>
    <text x="735" y="116" text-anchor="middle" font-size="11" fill="#64748b">3nm 以下（三星已用，台积电 2nm）</text>
    <!-- 纳米片堆叠 -->
    <rect x="660" y="146" width="150" height="14" fill="#e2e8f0" stroke="#94a3b8"/>
    <rect x="660" y="170" width="150" height="14" fill="#e2e8f0" stroke="#94a3b8"/>
    <rect x="660" y="194" width="150" height="14" fill="#e2e8f0" stroke="#94a3b8"/>
    <rect x="650" y="136" width="170" height="14" fill="#475569" opacity="0.75"/>
    <rect x="650" y="162" width="170" height="14" fill="#475569" opacity="0.75"/>
    <rect x="650" y="188" width="170" height="14" fill="#475569" opacity="0.75"/>
    <rect x="650" y="212" width="170" height="14" fill="#475569" opacity="0.75"/>
    <text x="735" y="246" text-anchor="middle" font-size="10" fill="#ffffff">Gate 材料把纳米片四面全包住</text>
    <text x="735" y="262" text-anchor="middle" font-size="11.5" fill="#7c3aed">栅极 4 面包围，控制力最强</text>
    <text x="735" y="280" text-anchor="middle" font-size="11.5" fill="#64748b">沟道宽度可由片数调节</text>
  </g>

  <!-- 底部：工艺难点 -->
  <rect x="40" y="296" width="820" height="148" rx="10" fill="#fff7ed" stroke="#fb923c"/>
  <text x="58" y="322" font-size="14" font-weight="700" fill="#9a3412">结构越复杂，工艺难点越难（这就是 PE/EE 的价值所在）</text>

  <rect x="58" y="336" width="252" height="92" rx="8" fill="#ffffff" stroke="#fed7aa"/>
  <text x="72" y="358" font-size="12.5" font-weight="700" fill="#c2410c">FinFET 的坑</text>
  <text x="72" y="378" font-size="11.5" fill="#1e293b">Fin 刻蚀：高深宽比、不能倒</text>
  <text x="72" y="396" font-size="11.5" fill="#1e293b">Fin 宽度均匀性直接决定 Vt 均一性</text>
  <text x="72" y="414" font-size="11.5" fill="#1e293b">栅极填充：缝隙不能有 Void</text>

  <rect x="324" y="336" width="252" height="92" rx="8" fill="#ffffff" stroke="#fed7aa"/>
  <text x="338" y="358" font-size="12.5" font-weight="700" fill="#c2410c">GAA 的坑</text>
  <text x="338" y="378" font-size="11.5" fill="#1e293b">Si/SiGe 超晶格外延生长</text>
  <text x="338" y="396" font-size="11.5" fill="#1e293b">选择性释放沟道（Channel Release）</text>
  <text x="338" y="414" font-size="11.5" fill="#1e293b">内侧 spacer + 高-k 四面填充</text>

  <rect x="590" y="336" width="252" height="92" rx="8" fill="#ffffff" stroke="#fed7aa"/>
  <text x="604" y="358" font-size="12.5" font-weight="700" fill="#c2410c">共同难点</text>
  <text x="604" y="378" font-size="11.5" fill="#1e293b">CD 均匀性、Overlay 套刻精度</text>
  <text x="604" y="396" font-size="11.5" fill="#1e293b">薄膜保形性（Conformality）</text>
  <text x="604" y="414" font-size="11.5" fill="#1e293b">缺陷密度必须做到极低</text>
</svg>
