<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="PingFang SC, Microsoft YaHei, Helvetica, Arial, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Fab 里的岗位地图：EE 与 PE 站在哪、跟谁配合</text>

  <!-- 中央晶圆 -->
  <circle cx="450" cy="300" r="58" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text x="450" y="294" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">晶圆</text>
  <text x="450" y="312" text-anchor="middle" font-size="11" fill="#64748b">Wafer / Lot</text>

  <!-- EE -->
  <rect x="60" y="180" width="200" height="98" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="160" y="206" text-anchor="middle" font-size="15" font-weight="700" fill="#1e40af">EE 设备工程师</text>
  <text x="76" y="228" font-size="12" fill="#1e293b">主人：机台（硬件）</text>
  <text x="76" y="246" font-size="12" fill="#1e293b">让机台转起来、别坏、</text>
  <text x="76" y="264" font-size="12" fill="#1e293b">坏了快点修好</text>

  <!-- PE -->
  <rect x="640" y="180" width="200" height="98" rx="12" fill="#d1fae5" stroke="#059669" stroke-width="2.5"/>
  <text x="740" y="206" text-anchor="middle" font-size="15" font-weight="700" fill="#065f46">PE 制程工程师</text>
  <text x="656" y="228" font-size="12" fill="#1e293b">主人：工艺（配方）</text>
  <text x="656" y="246" font-size="12" fill="#1e293b">让做出来的膜/线宽/形貌</text>
  <text x="656" y="264" font-size="12" fill="#1e293b">落在规格内、良率高</text>

  <!-- PIE -->
  <rect x="640" y="60" width="200" height="88" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="740" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#5b21b6">PIE 工艺整合</text>
  <text x="656" y="106" font-size="11.5" fill="#1e293b">串起所有模块，看整体</text>
  <text x="656" y="122" font-size="11.5" fill="#1e293b">电性与良率（硕士为主）</text>
  <text x="656" y="138" font-size="11.5" fill="#1e293b">PE 干 2-3 年后的常见去向</text>

  <!-- MFG -->
  <rect x="60" y="60" width="200" height="88" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="160" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">MFG 制造部</text>
  <text x="76" y="106" font-size="11.5" fill="#1e293b">排产、跑货、过站操作</text>
  <text x="76" y="122" font-size="11.5" fill="#1e293b">Operator / 领班</text>
  <text x="76" y="138" font-size="11.5" fill="#1e293b">每天跟 EE/PE 打交道最多</text>

  <!-- YE -->
  <rect x="60" y="330" width="200" height="88" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="160" y="356" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">YE 良率工程师</text>
  <text x="76" y="376" font-size="11.5" fill="#1e293b">缺陷、颗粒、bin map</text>
  <text x="76" y="392" font-size="11.5" fill="#1e293b">找杀手缺陷（killer defect）</text>
  <text x="76" y="408" font-size="11.5" fill="#1e293b">SEM / 光学检缺点</text>

  <!-- TD -->
  <rect x="640" y="330" width="200" height="88" rx="12" fill="#cffafe" stroke="#0891b2" stroke-width="2"/>
  <text x="740" y="356" text-anchor="middle" font-size="14" font-weight="700" fill="#155e75">TD 技术研发</text>
  <text x="656" y="376" font-size="11.5" fill="#1e293b">下一代节点开发</text>
  <text x="656" y="392" font-size="11.5" fill="#1e293b">先进机台、新结构</text>
  <text x="656" y="408" font-size="11.5" fill="#1e293b">博士/顶尖硕士聚集地</text>

  <!-- 连到晶圆 -->
  <path d="M260 229 L392 275" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ab)"/>
  <path d="M640 229 L508 275" stroke="#059669" stroke-width="2.5" marker-end="url(#ag)"/>
  <path d="M640 118 L520 262" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ap)"/>
  <path d="M260 118 L380 262" stroke="#d97706" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ao)"/>
  <path d="M260 374 L392 325" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <path d="M640 374 L508 325" stroke="#0891b2" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ac)"/>

  <defs>
    <marker id="ab" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#2563eb"/></marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#059669"/></marker>
    <marker id="ap" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#7c3aed"/></marker>
    <marker id="ao" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#d97706"/></marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/></marker>
    <marker id="ac" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#0891b2"/></marker>
  </defs>

  <!-- 中间连线说明 -->
  <text x="450" y="452" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">EE ↔ PE：Fab 里最经典的一对搭档</text>

  <rect x="60" y="468" width="375" height="74" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="76" y="490" font-size="12.5" fill="#1e40af">机台出状况时，先问一句：是「机」的问题还是「工艺」的问题？</text>
  <text x="76" y="510" font-size="12.5" fill="#1e293b">颗粒超标 → PE 怀疑机台脏了 → EE 开腔清洁、换 parts</text>
  <text x="76" y="530" font-size="12.5" fill="#1e293b">刻蚀深度漂移 → EE 怀疑 RF/气体 → PE 怀疑 recipe 与膜层</text>

  <rect x="455" y="468" width="385" height="74" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="471" y="490" font-size="12.5" fill="#065f46">判断口诀：<tspan font-weight="700">换机台试试</tspan></text>
  <text x="471" y="510" font-size="12.5" fill="#1e293b">同 recipe 换一台机，结果跟着走 → 机台问题（EE 背）</text>
  <text x="471" y="530" font-size="12.5" fill="#1e293b">同 recipe 换一台机，结果一样差 → 工艺问题（PE 背）</text>
</svg>
